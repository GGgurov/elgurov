<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>elgurov | Hub</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #050509;
            --primary-neon: #00f2fe;
            --secondary-neon: #4facfe;
            --twitch-color: #9146FF;
            --tg-color: #0088cc;
            --kaspi-color: #f14635;
            --vtb-color: #002882;
            --crypto-color: #f3ba2f;
            --dalink-color: #ff3b8f;
            --text-main: #ffffff;
            --text-muted: #8b9bb4;
            --glass: rgba(255, 255, 255, 0.03);
            --border-glass: rgba(255, 255, 255, 0.08);
            --menu-glass: rgba(0, 0, 0, 0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            transform: translateZ(0);
        }

        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: 
                radial-gradient(circle at 10% 20%, rgba(79, 70, 229, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(0, 242, 254, 0.1) 0%, transparent 40%),
                radial-gradient(circle at 50% 50%, rgba(145, 70, 255, 0.05) 0%, transparent 60%),
                linear-gradient(135deg, #050509 0%, #11111d 100%);
            z-index: -1;
            animation: bgPulse 15s ease infinite alternate;
            will-change: transform, opacity;
        }

        @keyframes bgPulse {
            0% { transform: scale(1); opacity: 0.8; }
            100% { transform: scale(1.05); opacity: 1; }
        }

        .main-card {
            width: 100%;
            max-width: 420px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 30px;
            padding: 40px 25px;
            border: 1px solid var(--border-glass);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
            text-align: center;
            position: relative;
            animation: cardAppear 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            opacity: 0;
            transform: translateY(40px);
            will-change: transform, opacity;
        }

        @keyframes cardAppear {
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-area { margin-bottom: 30px; }

        .avatar-wrapper {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            margin: 0 auto 20px;
            position: relative;
            padding: 5px;
            background: linear-gradient(135deg, var(--primary-neon), var(--secondary-neon));
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: #111;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 4px solid #0a0a12;
            position: relative;
            z-index: 1;
            overflow: hidden;
        }

        .avatar-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        .status-dot {
            width: 18px;
            height: 18px;
            background-color: #00ff88;
            border-radius: 50%;
            position: absolute;
            bottom: 5px; right: 5px;
            border: 3px solid #0a0a12;
            z-index: 2;
            box-shadow: 0 0 10px #00ff88;
        }

        h1 {
            font-size: 28px;
            font-weight: 700;
            background: linear-gradient(to right, #fff, #b2b9c9);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        /* ========== СПИСОК КНОПОК ========== */
        .links-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-item {
            opacity: 0;
            transform: translateY(20px);
            animation: itemAppear 0.5s ease forwards;
            will-change: transform, opacity;
        }

        .link-item:nth-child(1) { animation-delay: 0.15s; }
        .link-item:nth-child(2) { animation-delay: 0.25s; }
        .link-item:nth-child(3) { animation-delay: 0.35s; }
        .link-item:nth-child(4) { animation-delay: 0.45s; }
        .link-item:nth-child(5) { animation-delay: 0.55s; }
        .link-item:nth-child(6) { animation-delay: 0.65s; }
        .link-item:nth-child(7) { animation-delay: 0.75s; }
        .link-item:nth-child(8) { animation-delay: 0.85s; }

        @keyframes itemAppear {
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== БАЗОВЫЕ КНОПКИ ===== */
        .btn-action {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 18px 22px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-glass);
            border-radius: 18px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 16px;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.23, 1, 0.32, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
            text-align: left;
        }

        .btn-action i.main-icon {
            font-size: 24px;
            margin-right: 15px;
            width: 30px;
            text-align: center;
            transition: transform 0.3s ease;
        }

        .btn-content {
            display: flex;
            flex-direction: column;
            flex: 1;
        }

        .btn-title { font-size: 15px; }
        .btn-subtitle {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 400;
            margin-top: 2px;
        }

        .arrow-icon {
            font-size: 12px;
            opacity: 0.4;
            transition: all 0.3s ease;
        }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .btn-action:active { transform: scale(0.98); }

        /* ===== МАЛЕНЬКИЕ КНОПКИ (вторичные) ===== */
        .btn-action.btn-small {
            padding: 13px 18px;
        }
        .btn-action.btn-small i.main-icon {
            font-size: 19px;
            margin-right: 12px;
            width: 24px;
        }
        .btn-action.btn-small .btn-title { font-size: 13px; }
        .btn-action.btn-small .btn-subtitle { font-size: 11px; }

        /* ===== 1. KASPI — HERO (самый большой) ===== */
        .btn-kaspi-hero {
            padding: 22px 24px;
            background: linear-gradient(135deg, rgba(241, 70, 53, 0.18) 0%, rgba(200, 40, 30, 0.10) 100%);
            border: 1.5px solid rgba(241, 70, 53, 0.5);
            border-radius: 22px;
            box-shadow: 0 6px 30px rgba(241, 70, 53, 0.2), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .btn-kaspi-hero i.main-icon {
            font-size: 28px;
            color: var(--kaspi-color);
        }
        .btn-kaspi-hero .btn-title { font-size: 17px; }
        .btn-kaspi-hero .btn-subtitle { font-size: 13px; }
        .btn-kaspi-hero:hover {
            background: linear-gradient(135deg, rgba(241, 70, 53, 0.28) 0%, rgba(200, 40, 30, 0.18) 100%);
            box-shadow: 0 8px 40px rgba(241, 70, 53, 0.35);
            transform: translateY(-3px);
            border-color: rgba(241, 70, 53, 0.7);
        }

        /* ===== 2. TWITCH — ГЛАВНЫЙ (светящийся) ===== */
        .btn-twitch-hero {
            padding: 20px 22px;
            background: linear-gradient(135deg, rgba(145, 70, 255, 0.25) 0%, rgba(100, 40, 220, 0.15) 100%);
            border: 1.5px solid rgba(145, 70, 255, 0.6);
            border-radius: 20px;
            box-shadow:
                0 0 0 0 rgba(145, 70, 255, 0.5),
                0 6px 30px rgba(145, 70, 255, 0.3),
                inset 0 1px 0 rgba(255,255,255,0.07);
            animation: itemAppear 0.5s ease forwards, twitchGlow 2.5s ease-in-out infinite;
            position: relative;
            overflow: visible;
        }

        /* Светящийся ореол */
        .btn-twitch-hero::before {
            content: '';
            position: absolute;
            inset: -3px;
            border-radius: 22px;
            background: linear-gradient(135deg, rgba(145, 70, 255, 0.4), rgba(180, 120, 255, 0.2), rgba(145, 70, 255, 0.4));
            background-size: 200% 200%;
            animation: twitchBorderFlow 2.5s linear infinite;
            z-index: -1;
            filter: blur(4px);
        }

        @keyframes twitchGlow {
            0%, 100% { box-shadow: 0 0 20px rgba(145, 70, 255, 0.4), 0 6px 30px rgba(145, 70, 255, 0.25); }
            50%       { box-shadow: 0 0 40px rgba(145, 70, 255, 0.7), 0 8px 40px rgba(145, 70, 255, 0.45); }
        }

        @keyframes twitchBorderFlow {
            0%   { background-position: 0% 50%; opacity: 0.8; }
            50%  { background-position: 100% 50%; opacity: 1; }
            100% { background-position: 0% 50%; opacity: 0.8; }
        }

        .btn-twitch-hero i.main-icon {
            font-size: 26px;
            color: #bf94ff;
            filter: drop-shadow(0 0 8px rgba(145, 70, 255, 0.9));
            animation: iconPulse 2.5s ease-in-out infinite;
        }

        @keyframes iconPulse {
            0%, 100% { filter: drop-shadow(0 0 8px rgba(145, 70, 255, 0.9)); }
            50%       { filter: drop-shadow(0 0 16px rgba(145, 70, 255, 1)) drop-shadow(0 0 30px rgba(180, 120, 255, 0.5)); }
        }

        .btn-twitch-hero .btn-title {
            font-size: 16px;
            background: linear-gradient(to right, #fff, #d4b4ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .btn-twitch-hero .btn-subtitle { font-size: 12px; }
        .btn-twitch-hero .arrow-icon {
            color: #9146FF;
            opacity: 0.8;
        }

        .btn-twitch-hero:hover {
            transform: translateY(-3px) scale(1.01);
            background: linear-gradient(135deg, rgba(145, 70, 255, 0.35) 0%, rgba(100, 40, 220, 0.25) 100%);
            border-color: rgba(145, 70, 255, 0.85);
        }

        /* LIVE Badge */
        .live-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(145, 70, 255, 0.2);
            border: 1px solid rgba(145, 70, 255, 0.5);
            border-radius: 20px;
            padding: 3px 9px;
            font-size: 10px;
            font-weight: 700;
            color: #bf94ff;
            letter-spacing: 0.5px;
            margin-left: auto;
            flex-shrink: 0;
        }

        .live-badge .live-dot {
            width: 6px;
            height: 6px;
            background: #9146FF;
            border-radius: 50%;
            box-shadow: 0 0 6px rgba(145, 70, 255, 0.9);
            animation: livePulse 1.2s ease infinite;
        }

        @keyframes livePulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.7); }
        }

        /* ===== 3. ДОНАТ — MEGA ===== */
        .btn-donate-mega {
            background: linear-gradient(270deg, #ff9f43, #ff4757, #ff9f43);
            background-size: 200% 200%;
            animation: itemAppear 0.5s ease forwards, gradientShift 3s ease infinite;
            border: 1px solid rgba(255, 159, 67, 0.6);
            box-shadow: 0 5px 25px rgba(255, 71, 87, 0.3);
        }

        .btn-donate-mega .btn-title,
        .btn-donate-mega .btn-subtitle,
        .btn-donate-mega i {
            color: #fff !important;
            -webkit-text-fill-color: #fff !important;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }

        @keyframes gradientShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .btn-donate-mega:hover {
            box-shadow: 0 8px 35px rgba(255, 71, 87, 0.5);
            transform: translateY(-3px) scale(1.02);
        }

        /* ===== ОСТАЛЬНЫЕ (маленькие) ===== */
        .btn-dalink i.main-icon { color: var(--dalink-color); }
        .btn-dalink:hover { box-shadow: 0 0 20px rgba(255, 59, 143, 0.15); }

        .btn-vtb i.main-icon { color: #00a3ff; }
        .btn-vtb.active {
            background: rgba(0, 163, 255, 0.1);
            border-color: rgba(0, 163, 255, 0.3);
        }

        .btn-tg i.main-icon { color: var(--tg-color); }
        .btn-tg:hover { box-shadow: 0 0 20px rgba(0, 136, 204, 0.15); }

        .btn-crypto i.main-icon { color: var(--crypto-color); }
        .btn-crypto:hover { box-shadow: 0 0 20px rgba(243, 186, 47, 0.15); }

        /* ===== РАЗДЕЛИТЕЛЬ ===== */
        .section-divider {
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: itemAppear 0.5s ease forwards;
        }
        .section-divider span {
            font-size: 10px;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 1.5px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .section-divider::before,
        .section-divider::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--border-glass);
        }

        /* ===== ВЫПАДАЮЩИЕ МЕНЮ ===== */
        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            background: var(--menu-glass);
            border-radius: 0 0 18px 18px;
            margin-top: -10px;
            padding: 0 10px;
            opacity: 0;
            transform: translateY(-10px);
        }

        .submenu.open {
            opacity: 1;
            transform: translateY(0);
            padding: 15px 10px 10px 10px;
            margin-bottom: 5px;
        }

        .sub-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            color: #fff;
            font-size: 13px;
            font-family: 'Poppins', sans-serif;
            cursor: pointer;
            margin-bottom: 8px;
            transition: 0.2s;
        }

        .sub-btn:last-child { margin-bottom: 0; }

        .sub-btn:hover {
            background: rgba(255,255,255,0.15);
            transform: scale(1.02);
        }

        .sub-btn i { font-size: 14px; opacity: 0.7; }

        .btn-action.active .arrow-icon {
            transform: rotate(180deg);
            opacity: 1;
        }

        /* Kaspi hero — тоже expand */
        .btn-kaspi-hero.active .arrow-icon {
            transform: rotate(180deg);
            opacity: 1;
        }

        /* ===== TOAST ===== */
        #toast-container {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
        }

        .toast {
            background: rgba(10, 10, 18, 0.95);
            color: #fff;
            padding: 15px 25px;
            border-radius: 12px;
            border: 1px solid var(--primary-neon);
            box-shadow: 0 10px 30px rgba(0, 242, 254, 0.2);
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 12px;
            font-weight: 600;
            font-size: 14px;
            transform: translateY(-100px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast i { color: var(--primary-neon); font-size: 18px; }

        footer {
            margin-top: 30px;
            font-size: 12px;
            color: var(--text-muted);
            opacity: 0.5;
        }

        @media (max-width: 480px) {
            body { padding: 15px; align-items: flex-start; }
            .main-card { padding: 30px 20px; border-radius: 25px; }
            h1 { font-size: 24px; }
            .btn-action { padding: 16px 20px; }
            .btn-kaspi-hero { padding: 20px 20px; }
            .btn-twitch-hero { padding: 18px 20px; }
        }
    </style>
</head>

    </div>

    <script>
        document.querySelectorAll('.toggle-menu').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const submenu = this.nextElementSibling;

                document.querySelectorAll('.submenu').forEach(menu => {
                    if (menu !== submenu) {
                        menu.classList.remove('open');
                        menu.style.maxHeight = null;
                        menu.previousElementSibling.classList.remove('active');
                    }
                });

                if (submenu.classList.contains('open')) {
                    submenu.classList.remove('open');
                    submenu.style.maxHeight = null;
                    this.classList.remove('active');
                } else {
                    submenu.classList.add('open');
                    submenu.style.maxHeight = submenu.scrollHeight + 30 + "px";
                    this.classList.add('active');
                }
            });
        });

        function copyToClipboard(textToCopy, label) {
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    showToast(label + ' скопирован!');
                }).catch(() => fallbackCopy(textToCopy, label));
            } else {
                fallbackCopy(textToCopy, label);
            }
        }

        function fallbackCopy(text, label) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.style.position = "fixed";
            textArea.style.left = "-9999px";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                if (document.execCommand('copy')) showToast(label + ' скопирован!');
            } catch (err) {}
            document.body.removeChild(textArea);
        }

        let toastTimeout;
        function showToast(message) {
            const toast = document.getElementById('copy-toast');
            const toastMsg = document.getElementById('toast-message');
            toastMsg.textContent = message;
            toast.classList.remove('show');
            clearTimeout(toastTimeout);
            void toast.offsetWidth;
            toast.classList.add('show');
            toastTimeout = setTimeout(() => toast.classList.remove('show'), 2500);
            if ('vibrate' in navigator) navigator.vibrate(50);
        }
    </script>
</body>
</html>
