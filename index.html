<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>elgurov | Hub</title>
    
    <!-- Шрифты и иконки -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    
    <style>
        :root {
            --bg-dark: #121212;
            --kaspi-red: #f02d2d;
            --twitch-color: #9146FF;
            --tg-color: #0088cc;
            --vtb-color: #002882;
            --crypto-color: #f3ba2f;
            --dalink-color: #ff3b8f;
            --text-main: #ffffff;
            --text-muted: rgba(255, 255, 255, 0.5);
            --success-color: #00e676;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Unbounded', sans-serif;
            background: radial-gradient(circle at 50% 0%, #3a1c1d 0%, var(--bg-dark) 100%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Фоновый эффект Kaspi */
        .glow-circle {
            position: fixed;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            width: 350px;
            height: 350px;
            background: var(--kaspi-red);
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.35;
            z-index: -1;
            animation: pulseBg 4s infinite alternate;
        }

        @keyframes pulseBg {
            0% { transform: translate(-50%, 0) scale(1); opacity: 0.25; }
            100% { transform: translate(-50%, 0) scale(1.1); opacity: 0.45; }
        }

        .main-container {
            width: 100%;
            max-width: 420px;
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 1;
        }

        /* Профиль */
        .avatar-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            margin: 0 auto 15px;
            border: 2px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .avatar-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* ===== ГЛАВНАЯ КНОПКА KASPI (Интегрированное уведомление) ===== */
        .glass-btn {
            position: relative;
            width: 100%;
            height: 110px; /* Фиксированная высота для анимации внутренностей */
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px) saturate(150%);
            -webkit-backdrop-filter: blur(20px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            text-decoration: none;
            overflow: hidden;
            margin-bottom: 30px;
            padding: 0;
        }

        .glass-btn::before {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.08), transparent);
            transform: skewX(-20deg);
            transition: 0.6s;
        }

        .glass-btn:hover::before { left: 150%; }
        .glass-btn:hover {
            transform: translateY(-5px);
            border-color: rgba(240, 45, 45, 0.4);
            box-shadow: 0 25px 50px rgba(240, 45, 45, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }
        .glass-btn:active { transform: scale(0.97); }

        /* Внутренние состояния кнопки Kaspi */
        .kaspi-state {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 100%;
            height: 100%;
        }

        .kaspi-default {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        .kaspi-success {
            opacity: 0;
            transform: scale(0.5) translateY(20px);
            pointer-events: none;
            background: rgba(240, 45, 45, 0.15); /* Легкая подсветка при успехе */
        }

        /* Класс, который вешается через JS при клике */
        .glass-btn.copied {
            border-color: var(--kaspi-red);
            box-shadow: 0 0 40px rgba(240, 45, 45, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
        }

        .glass-btn.copied .kaspi-default {
            opacity: 0;
            transform: scale(1.2) translateY(-20px);
        }

        .glass-btn.copied .kaspi-success {
            opacity: 1;
            transform: scale(1) translateY(0);
        }

        /* Тексты внутри кнопки */
        .btn-title-main {
            font-size: 24px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .btn-title-main i.fa-credit-card { color: var(--kaspi-red); font-size: 28px; }
        
        .btn-number-main {
            font-size: 18px;
            font-weight: 400;
            color: var(--text-muted);
            letter-spacing: 2px;
        }

        /* Стили для успешного текста */
        .success-title {
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .success-title i { color: var(--success-color); font-size: 22px; }
        
        .success-subtitle {
            font-size: 15px;
            font-weight: 600;
            color: #ffb7b7;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* ===== КНОПКА РАСКРЫТИЯ (ДОПОЛНИТЕЛЬНО) ===== */
        .toggle-hub-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-family: inherit;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 20px;
            transition: 0.3s;
            margin-bottom: 20px;
        }
        .toggle-hub-btn:hover { color: #fff; }
        .toggle-hub-btn i { transition: transform 0.4s ease; }
        .toggle-hub-btn.active i { transform: rotate(180deg); color: #fff; }

        /* ===== СКРЫТЫЙ БЛОК СО ССЫЛКАМИ ===== */
        .hub-links-wrapper {
            width: 100%;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.6s cubic-bezier(0.25, 1, 0.5, 1);
            opacity: 0;
        }
        .hub-links-wrapper.open {
            opacity: 1;
        }
        
        .links-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding-bottom: 30px;
        }

        /* Стили второстепенных кнопок */
        .btn-action {
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            color: var(--text-main);
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s ease;
            cursor: pointer;
            text-align: left;
        }
        .btn-action i.main-icon {
            font-size: 20px;
            margin-right: 15px;
            width: 24px;
            text-align: center;
        }
        .btn-content { display: flex; flex-direction: column; flex: 1; }
        .btn-title { font-size: 14px; }
        .btn-subtitle { font-size: 11px; color: var(--text-muted); font-weight: 400; margin-top: 4px; }
        .arrow-icon { font-size: 12px; opacity: 0.3; }

        .btn-action:hover {
            background: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.1);
        }
        
        .btn-twitch i.main-icon { color: var(--twitch-color); text-shadow: 0 0 10px rgba(145, 70, 255, 0.5); }
        .btn-donate i.main-icon { color: #ff4757; }
        .btn-vtb i.main-icon { color: #00a3ff; }
        .btn-crypto i.main-icon { color: var(--crypto-color); }
        .btn-tg i.main-icon { color: var(--tg-color); }

        /* Вложенные меню (ВТБ) */
        .submenu {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 0 0 18px 18px;
            margin-top: -10px;
            padding: 0 10px;
            opacity: 0;
        }
        .submenu.open {
            opacity: 1;
            padding: 15px 10px 10px 10px;
            margin-bottom: 5px;
        }
        .sub-btn {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            padding: 12px 15px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            color: #fff;
            font-size: 12px;
            font-family: inherit;
            cursor: pointer;
            margin-bottom: 8px;
            transition: 0.2s;
        }
        .sub-btn:hover { background: rgba(255,255,255,0.1); }
        
        /* ===== ОБЫЧНЫЕ УВЕДОМЛЕНИЯ (ДЛЯ ОСТАЛЬНЫХ КНОПОК) ===== */
        .toast {
            position: fixed;
            top: -100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.85);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            padding: 16px 24px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 12px;
            transition: top 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            z-index: 1000;
            font-size: 14px;
            font-weight: 600;
        }
        .toast.show { top: 30px; }
    </style>
</head>
<body>

    <div class="glow-circle"></div>

    <!-- Уведомление для крипты и ВТБ -->
    <div id="toast" class="toast">
        <span id="toast-message">Скопировано!</span>
    </div>

    <div class="main-container">
        <!-- Профиль -->
        <div class="avatar-img">
            <img src="avatar.jpg" alt="elgurov" onerror="this.src='https://via.placeholder.com/90/111/fff?text=EG'"/>
        </div>
        <h1>elgurov</h1>

        <!-- Главная кнопка Kaspi с двумя стейтами внутри -->
        <button class="glass-btn" id="kaspi-main-btn" onclick="copyKaspiIntegrated()">
            
            <!-- Обычное состояние -->
            <div class="kaspi-state kaspi-default">
                <span class="btn-title-main"><i class="fa-solid fa-credit-card"></i> Kaspi Pay</span>
                <span class="btn-number-main">77471242778</span>
            </div>

            <!-- Успешное состояние (Скопировано) -->
            <div class="kaspi-state kaspi-success">
                <span class="success-title"><i class="fa-solid fa-circle-check"></i> Скопировано</span>
                <span class="success-subtitle">Спасибо • Рахмет ❤️</span>
            </div>

        </button>

        <!-- Кнопка скрытого меню -->
        <button class="toggle-hub-btn" onclick="toggleHub()">
            Донат из СНГ и тд. <i class="fa-solid fa-chevron-down"></i>
        </button>

        <!-- Скрытые ссылки -->
        <div class="hub-links-wrapper" id="hub-links">
            <ul class="links-list">
                
                <li class="link-item">
                    <a href="https://www.twitch.tv/elgurov" target="_blank" class="btn-action btn-twitch">
                        <i class="fa-brands fa-twitch main-icon"></i>
                        <div class="btn-content">
                            <span class="btn-title">Twitch Канал</span>
                            <span class="btn-subtitle">Прямые трансляции</span>
                        </div>
                        <i class="fa-solid fa-arrow-right arrow-icon"></i>
                    </a>
                </li>

                <li class="link-item">
                    <a href="https://www.donationalerts.com/r/elgurov" target="_blank" class="btn-action btn-donate">
                        <i class="fa-solid fa-fire main-icon"></i>
                        <div class="btn-content">
                            <span class="btn-title">Донаты из РФ и СНГ</span>
                            <span class="btn-subtitle">Алерт на экран</span>
                        </div>
                        <i class="fa-solid fa-arrow-right arrow-icon"></i>
                    </a>
                </li>

                <li class="link-item">
                    <div class="expand-container">
                        <button class="btn-action btn-vtb toggle-menu">
                            <i class="fa-solid fa-building-columns main-icon"></i>
                            <div class="btn-content">
                                <span class="btn-title">ВТБ (Из РФ)</span>
                                <span class="btn-subtitle">Открыть реквизиты</span>
                            </div>
                            <i class="fa-solid fa-chevron-down arrow-icon"></i>
                        </button>
                        <div class="submenu">
                            <button class="sub-btn" onclick="copySimple('2204360100149580', 'Номер карты ВТБ')">
                                Скопировать карту <i class="fa-regular fa-copy"></i>
                            </button>
                            <button class="sub-btn" onclick="copySimple('VLADISLAV GUROV', 'Имя получателя')">
                                Скопировать имя <i class="fa-regular fa-copy"></i>
                            </button>
                        </div>
                    </div>
                </li>

                <li class="link-item">
                    <button class="btn-action btn-crypto" onclick="copySimple('0x06a300e8b8c459ae210432203bdf12e02e301798', 'BEP20 адрес')">
                        <i class="fa-solid fa-wallet main-icon"></i>
                        <div class="btn-content">
                            <span class="btn-title">Крипта (USDT BEP20)</span>
                            <span class="btn-subtitle">Скопировать адрес</span>
                        </div>
                        <i class="fa-regular fa-copy arrow-icon"></i>
                    </button>
                </li>

                <li class="link-item">
                    <a href="https://t.me/elgurov" target="_blank" class="btn-action btn-tg">
                        <i class="fa-brands fa-telegram main-icon"></i>
                        <div class="btn-content">
                            <span class="btn-title">Telegram Канал</span>
                            <span class="btn-subtitle">Новости и общение</span>
                        </div>
                        <i class="fa-solid fa-arrow-right arrow-icon"></i>
                    </a>
                </li>

            </ul>
        </div>
    </div>

    <script>
        // === ИНТЕГРИРОВАННАЯ ЛОГИКА KASPI ===
        let kaspiResetTimeout;
        
        function copyKaspiIntegrated() {
            const phoneNumber = "77471242778"; 
            const btn = document.getElementById('kaspi-main-btn');

            navigator.clipboard.writeText(phoneNumber).then(() => {
                // Включаем успешное состояние (анимация переворота)
                btn.classList.add('copied');
                
                // Вибрация телефона для тактильного отклика (если поддерживает браузер)
                if (navigator.vibrate) navigator.vibrate(50);

                // Очищаем предыдущий таймер, если кликнули несколько раз подряд
                clearTimeout(kaspiResetTimeout);

                // Через 3.5 секунды возвращаем кнопку в исходное положение
                kaspiResetTimeout = setTimeout(() => {
                    btn.classList.remove('copied');
                }, 3500);

            }).catch(err => {
                alert('Не удалось скопировать. Проверьте разрешения браузера.');
            });
        }

        // === ПРОСТОЕ КОПИРОВАНИЕ (Для ВТБ и Крипты) ===
        let simpleToastTimeout;
        function copySimple(text, label) {
            navigator.clipboard.writeText(text).then(() => {
                const toast = document.getElementById('toast');
                const toastMsg = document.getElementById('toast-message');
                
                clearTimeout(simpleToastTimeout);
                toastMsg.innerHTML = `${label} скопирован!`;
                
                toast.classList.remove('show');
                void toast.offsetWidth; // Сброс анимации
                toast.classList.add('show');
                
                if (navigator.vibrate) navigator.vibrate(30);

                simpleToastTimeout = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2000);
            });
        }

        // === ЛОГИКА РАСКРЫТИЯ СЕКРЕТНОГО АРСЕНАЛА ===
        function toggleHub() {
            const btn = document.querySelector('.toggle-hub-btn');
            const hub = document.getElementById('hub-links');
            
            btn.classList.toggle('active');
            
            if (hub.classList.contains('open')) {
                hub.classList.remove('open');
                hub.style.maxHeight = null;
            } else {
                hub.classList.add('open');
                hub.style.maxHeight = hub.scrollHeight + "px";
            }
        }

        // === ЛОГИКА АККОРДЕОНА (ВТБ) ===
        document.querySelectorAll('.toggle-menu').forEach(btn => {
            btn.addEventListener('click', function(e) {
                e.preventDefault();
                const submenu = this.nextElementSibling;
                const parentHub = document.getElementById('hub-links');

                if (submenu.classList.contains('open')) {
                    submenu.classList.remove('open');
                    submenu.style.maxHeight = null;
                } else {
                    submenu.classList.add('open');
                    submenu.style.maxHeight = submenu.scrollHeight + 30 + "px";
                }
                
                // Пересчет высоты родительского контейнера при открытии подменю
                setTimeout(() => {
                    if (parentHub.classList.contains('open')) {
                        parentHub.style.maxHeight = parentHub.scrollHeight + "px";
                    }
                }, 400);
            });
        });
    </script>
</body>
</html>
